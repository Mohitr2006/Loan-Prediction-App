{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
{% endblock %}

{% block content %}
<div class="container">

    <h1>Loan Approval Prediction</h1>
    <p>Enter the applicant details below.</p>

    <form action="/" method="POST">

        <div class="grid">

            <div class="input-box">
                <label>Number of Dependents</label>
                <input type="number" name="no_of_dependents" min="0" required>
            </div>

            <div class="input-box">
                <label>Education</label>

                <select name="education" required>
                    <option value="">Select</option>
                    <option value="Graduate">Graduate</option>
                    <option value="Not Graduate">Not Graduate</option>
                </select>
            </div>

            <div class="input-box">
                <label>Self Employed</label>

                <select name="self_employed" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="input-box">
                <label>Annual Income</label>
                <input type="number" name="income_annum" required>
            </div>

            <div class="input-box">
                <label>Loan Amount</label>
                <input type="number" name="loan_amount" required>
            </div>

            <div class="input-box">
                <label>Loan Term (Months)</label>
                <input type="number" name="loan_term" required>
            </div>

            <div class="input-box">
                <label>CIBIL Score</label>
                <input type="number"
                       name="cibil_score"
                       min="300"
                       max="900"
                       required>
            </div>

            <div class="input-box">
                <label>Residential Assets Value</label>
                <input type="number"
                       name="residential_assets_value"
                       required>
            </div>

            <div class="input-box">
                <label>Commercial Assets Value</label>
                <input type="number"
                       name="commercial_assets_value"
                       required>
            </div>

            <div class="input-box">
                <label>Luxury Assets Value</label>
                <input type="number"
                       name="luxury_assets_value"
                       required>
            </div>

            <div class="input-box">
                <label>Bank Asset Value</label>
                <input type="number"
                       name="bank_asset_value"
                       required>
            </div>

        </div>

        <button type="submit">Predict Loan Status</button>

    </form>

    {% if prediction %}

    <div class="result" id="prediction-result">

        <h2>{{ prediction }}</h2>

    </div>

    <script>
        document.getElementById("prediction-result").scrollIntoView({
            behavior: "smooth"
        });
    </script>

    {% endif %}

</div>

{% endblock %}
